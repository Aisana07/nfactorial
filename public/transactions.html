<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy - Транзакции</title>
    <!-- API URL -->
    <meta name="api-url" content="/api">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css"> 
    <link rel="stylesheet" href="/css/transactions.css"> <!-- Add specific styles if needed -->
</head>
<body>
    <div class="app-container">
        <!-- Боковое меню (copy from index.html) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">BudgetBuddy</h1>
                <button class="btn d-md-none" id="close-sidebar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Главная</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/transactions"><i class="fas fa-exchange-alt"></i> Транзакции</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categories"><i class="fas fa-tags"></i> Категории</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analytics"><i class="fas fa-chart-pie"></i> Аналитика</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ai-assistant"><i class="fas fa-robot"></i> AI-Помощник</a></li>
                    <li class="nav-item"><a class="nav-link" href="/settings"><i class="fas fa-cog"></i> Настройки</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-primary w-100 mb-2" id="add-transaction-btn"><i class="fas fa-plus"></i> Добавить транзакцию</button>
                <button class="btn btn-outline-danger w-100" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</button>
            </div>
        </aside>
        
        <!-- Основной контент -->
        <main class="content">
            <!-- Шапка (copy from index.html) -->
            <header class="content-header">
                <button class="btn sidebar-toggle d-md-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="user-info" id="user-info">
                    <span class="user-greeting">Привет, <span id="username">Пользователь</span></span>
                    <img src="/images/default-avatar.png" alt="Avatar" class="user-avatar">
                </div>
            </header>
            
            <!-- Тело страницы Транзакций -->
            <div class="content-body">
                <div class="transactions-page">
                    <div class="page-header">
                        <h2>Все транзакции</h2>
                        <!-- Filters can be added here -->
                        <div class="filters">
                             <button class="btn btn-outline-secondary btn-sm" id="filter-toggle-btn">
                                <i class="fas fa-filter"></i> Фильтры
                            </button>
                        </div>
                    </div>

                    <!-- Filter Section (Initially Hidden) -->
                    <div class="card filter-section mb-3" id="filter-section" style="display: none;">
                        <div class="card-body">
                            <form id="filter-form" class="row g-3">
                                <div class="col-md-3">
                                    <label for="filter-type" class="form-label">Тип</label>
                                    <select id="filter-type" class="form-select form-select-sm">
                                        <option value="">Все</option>
                                        <option value="expense">Расходы</option>
                                        <option value="income">Доходы</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="filter-category" class="form-label">Категория</label>
                                    <select id="filter-category" class="form-select form-select-sm">
                                        <option value="">Все</option>
                                        <!-- Categories loaded by JS -->
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="filter-start-date" class="form-label">С даты</label>
                                    <input type="date" id="filter-start-date" class="form-control form-control-sm">
                                </div>
                                <div class="col-md-3">
                                    <label for="filter-end-date" class="form-label">По дату</label>
                                    <input type="date" id="filter-end-date" class="form-control form-control-sm">
                                </div>
                                <div class="col-12 text-end">
                                    <button type="button" class="btn btn-secondary btn-sm" id="reset-filters-btn">Сбросить</button>
                                    <button type="submit" class="btn btn-primary btn-sm">Применить</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Transaction List -->
                    <div class="card">
                        <div class="card-body">
                            <div class="transaction-list" id="all-transactions-list">
                                <!-- Transactions will be loaded here by JS -->
                                <div class="text-center py-5" id="transactions-loading-full">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Загрузка...</span>
                                    </div>
                                </div>
                                <div class="no-transactions" id="no-transactions-full" style="display: none;">
                                    <p>Транзакции не найдены. Попробуйте изменить фильтры или добавить новую транзакцию.</p>
                                </div>
                            </div>
                            <!-- Pagination -->
                            <nav aria-label="Transaction navigation" id="pagination-nav" style="display: none;">
                                <ul class="pagination pagination-sm justify-content-center" id="pagination-list">
                                    <!-- Pagination items will be loaded here -->
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Модальное окно для добавления/редактирования транзакции (copy from index.html) -->
    <div class="modal fade" id="transactionModal" tabindex="-1" aria-hidden="true">
        <!-- ... (modal content same as in index.html) ... -->
         <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="transactionModalTitle">Добавить транзакцию</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="transaction-form">
                        <input type="hidden" id="transaction-id">
                        <div class="mb-3">
                            <label class="form-label">Тип</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="type" id="type-expense" value="expense" checked>
                                <label class="btn btn-outline-danger" for="type-expense">Расход</label>
                                <input type="radio" class="btn-check" name="type" id="type-income" value="income">
                                <label class="btn btn-outline-success" for="type-income">Доход</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label">Сумма</label>
                            <input type="number" class="form-control" id="amount" required min="0" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Категория</label>
                            <select class="form-select" id="category" required>
                                <option value="" disabled selected>Выберите категорию</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Дата</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание</label>
                            <textarea class="form-control" id="description" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="save-transaction">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/transactions.js"></script> <!-- Include transactions specific JS -->
</body>
</html>
