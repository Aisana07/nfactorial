<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy - Категории</title>
    <!-- API URL -->
    <meta name="api-url" content="/api">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/categories.css"> <!-- Add specific styles if needed -->
</head>
<body>
    <div class="app-container">
        <!-- Боковое меню -->
        <aside class="sidebar" id="sidebar">
             <div class="sidebar-header">
                <h1 class="app-title">BudgetBuddy</h1>
                <button class="btn d-md-none" id="close-sidebar"><i class="fas fa-times"></i></button>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transactions"><i class="fas fa-exchange-alt"></i> Транзакции</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/categories"><i class="fas fa-tags"></i> Категории</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analytics"><i class="fas fa-chart-pie"></i> Аналитика</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ai-assistant"><i class="fas fa-robot"></i> AI-Помощник</a></li>
                    <li class="nav-item"><a class="nav-link" href="/settings"><i class="fas fa-cog"></i> Настройки</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-primary w-100 mb-2" id="add-category-btn"><i class="fas fa-plus"></i> Добавить категорию</button>
                <button class="btn btn-outline-danger w-100" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</button>
            </div>
        </aside>
        
        <!-- Основной контент -->
        <main class="content">
            <!-- Шапка -->
             <header class="content-header">
                <button class="btn sidebar-toggle d-md-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="user-info" id="user-info">
                    <span class="user-greeting">Привет, <span id="username">Пользователь</span></span>
                    <img src="/images/default-avatar.png" alt="Avatar" class="user-avatar">
                </div>
            </header>
            
            <!-- Тело страницы Категорий -->
            <div class="content-body">
                <div class="categories-page">
                    <div class="page-header">
                        <h2>Управление категориями</h2>
                        <button class="btn btn-primary btn-sm" id="add-category-header-btn">
                            <i class="fas fa-plus"></i> Добавить категорию
                        </button>
                    </div>

                    <!-- Список категорий -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Категории расходов</h5>
                                </div>
                                <div class="card-body">
                                    <div class="category-list" id="expense-category-list">
                                         <div class="text-center py-3" id="expense-loading">
                                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                                        </div>
                                        <div class="no-categories" id="no-expense-categories" style="display: none;">Нет категорий расходов.</div>
                                        <!-- Category items loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                             <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Категории доходов</h5>
                                </div>
                                <div class="card-body">
                                    <div class="category-list" id="income-category-list">
                                        <div class="text-center py-3" id="income-loading">
                                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                                        </div>
                                        <div class="no-categories" id="no-income-categories" style="display: none;">Нет категорий доходов.</div>
                                        <!-- Category items loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Модальное окно для добавления/редактирования категории -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">Добавить категорию</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="category-form">
                        <input type="hidden" id="category-id">
                         <div class="mb-3">
                            <label class="form-label">Тип</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="category-type" id="category-type-expense" value="expense" checked>
                                <label class="btn btn-outline-danger" for="category-type-expense">Расход</label>
                                <input type="radio" class="btn-check" name="category-type" id="category-type-income" value="income">
                                <label class="btn btn-outline-success" for="category-type-income">Доход</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="category-name" class="form-label">Название</label>
                            <input type="text" class="form-control" id="category-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="category-color" class="form-label">Цвет</label>
                            <input type="color" class="form-control form-control-color" id="category-color" value="#3498db" title="Выберите цвет">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Иконка</label>
                            <input type="hidden" id="category-icon">
                            <div class="d-flex align-items-center mb-2">
                                <span class="me-2">Выбрано:</span>
                                <span id="selected-icon-preview" class="icon-preview p-1 border rounded" style="min-width: 30px; display: inline-block; text-align: center;">
                                    <i class="fas fa-tag"></i> <!-- Иконка по умолчанию -->
                                </span>
                            </div>
                            <div id="icon-picker-grid" class="icon-picker-grid border rounded p-2" style="max-height: 150px; overflow-y: auto;">
                                <!-- Иконки будут загружены сюда с помощью JS -->
                                <small class="text-muted">Загрузка иконок...</small> 
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="save-category">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/categories.js"></script>
</body>
</html>
